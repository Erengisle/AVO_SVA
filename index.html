<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordträning 1–4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --board:#E9EEEC; --panel:#F8FAF9; --ink:#1B2330; --muted:#5A6573; --line:#C9D3D0;
  --accent:#1D5FBF; --led:#7A3FB3; --ledbg:#F0E4FB; --add:#1E8A5A;
  --ok:#1E8A5A; --okbg:#E3F4EB; --warn:#9A5B00; --warnbg:#FFF1D6; --bad:#C8322B; --badbg:#FBE7E5;
  --adv:#B07A00; --advbg:#FFF1C7; --field:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#1A2126; --panel:#222B31; --ink:#EEF2F4; --muted:#A5B0BA; --line:#3A4750;
    --accent:#78A9FF; --led:#C39BF0; --ledbg:#3B2A4D; --add:#5DD39E;
    --ok:#5DD39E; --okbg:#173A2A; --warn:#F2C14E; --warnbg:#3F3313; --bad:#FF7B72; --badbg:#46201E;
    --adv:#F2C14E; --advbg:#4A3C12; --field:#2E3A42;
  }
}
:root[data-theme="dark"]{
  --board:#1A2126; --panel:#222B31; --ink:#EEF2F4; --muted:#A5B0BA; --line:#3A4750;
  --accent:#78A9FF; --led:#C39BF0; --ledbg:#3B2A4D; --add:#5DD39E;
  --ok:#5DD39E; --okbg:#173A2A; --warn:#F2C14E; --warnbg:#3F3313; --bad:#FF7B72; --badbg:#46201E;
  --adv:#F2C14E; --advbg:#4A3C12; --field:#2E3A42;
}
*{box-sizing:border-box}
html{font-size:clamp(16px,1.2vw + 6px,25px)}
body{margin:0;background:var(--board);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45;min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

header{display:flex;align-items:center;gap:.6rem 1rem;padding:.6rem 1.2rem;border-bottom:2px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0;white-space:nowrap}
nav.tabs{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
nav.tabs button{border:0;background:transparent;padding:.35rem .7rem;border-radius:.4rem;font-size:.78rem;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tools{display:flex;gap:.3rem;flex-wrap:wrap}
.iconbtn{border:2px solid var(--line);background:var(--panel);border-radius:.4rem;padding:.25rem .55rem;font-size:.72rem}
.iconbtn.sum{border-color:var(--add);color:var(--add);font-weight:700}

.subnav{display:flex;gap:0;flex-wrap:wrap;margin:0 0 1rem;border:2px solid var(--line);border-radius:.5rem;overflow:hidden;width:max-content;max-width:100%;background:var(--panel)}
.subnav button{border:0;background:transparent;padding:.35rem .85rem;font-size:.8rem;color:var(--muted);border-right:1px solid var(--line)}
.subnav button:last-child{border-right:0}
.subnav button[aria-pressed="true"]{background:var(--ledbg);color:var(--led);font-weight:700}
.subnav .k{font-weight:700;margin-right:.3rem}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:1.1rem 1.4rem 1rem}
.instr{font-size:1rem;margin:0 0 .9rem;color:var(--muted)}
.instr b{color:var(--ink)}

/* ordruta */
.bank{background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;margin-bottom:1rem}
.bank summary{cursor:pointer;font-size:.75rem;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
.bank summary::-webkit-details-marker{display:none}
.bank summary::after{content:"▾";font-size:.8rem}
.bank:not([open]) summary::after{content:"▸"}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.45rem}
.chip{border:1px solid var(--line);background:var(--board);border-radius:.35rem;padding:.1rem .55rem;font-size:.85rem}
.chip.used{opacity:.4;text-decoration:line-through}
.chip:hover{border-color:var(--led)}

/* uppgift */
.item{background:var(--panel);border:2px solid var(--line);border-radius:.7rem;padding:1.1rem 1.3rem 1.2rem}
.item.done{border-color:var(--ok)}
.itemhead{display:flex;align-items:baseline;gap:.9rem;margin-bottom:.6rem}
.num{font-size:2.2rem;font-weight:700;line-height:1;min-width:1.4em;color:var(--muted)}
.item.done .num{color:var(--ok)}
.orig{font-size:1.2rem;color:var(--muted);margin:0}
.arrow{font-size:.75rem;color:var(--muted);margin:.4rem 0 .2rem;text-transform:uppercase;letter-spacing:.06em}
.sent{font-size:1.55rem;line-height:2.1;margin:0}
.gap{display:inline-flex;align-items:baseline;gap:.1rem;vertical-align:baseline}
.pre{font-weight:700;color:var(--led);font-style:italic}
.gap input{width:min(11em,62vw);font-size:1.35rem;padding:.05rem .4rem;border:0;border-bottom:3px solid var(--led);background:var(--field);border-radius:.3rem .3rem 0 0;color:var(--ink)}
.gap input:focus{outline:none;box-shadow:0 0 0 3px var(--ledbg)}
.gap input.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.gap input.no{border-color:var(--bad);background:var(--badbg)}
.gap input:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:1rem;padding:.05rem .6rem;color:var(--muted);margin:0 0 .5rem}
.tag b{color:var(--ink)}
.pairrow{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:center;font-size:1.55rem}
.pairrow .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block}
.pairrow .mid{color:var(--muted)}

.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:.45rem;padding:.35rem .9rem;font-size:.82rem;font-weight:700}
.btn.primary{background:var(--ink);color:var(--panel)}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn[hidden]{display:none}
.feedback{margin-top:.9rem;padding:.55rem .85rem;border-radius:.45rem;font-size:.92rem;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.warn{background:var(--warnbg);color:var(--warn)}
.feedback.info{background:var(--ledbg);color:var(--led)}

/* flerval */
.opts{display:flex;flex-direction:column;gap:.45rem;margin-top:.4rem}
.opt{text-align:left;border:2px solid var(--line);background:var(--board);border-radius:.45rem;padding:.45rem .8rem;font-size:1.15rem}
.opt .l{font-weight:700;margin-right:.5rem;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}

/* para ihop */
.match{display:grid;gap:.5rem}
.mrow{display:grid;grid-template-columns:minmax(10rem,1fr) minmax(12rem,1.4fr);gap:.6rem;align-items:center;font-size:1.1rem}
.mrow select{width:100%;padding:.3rem .4rem;border:2px solid var(--line);border-radius:.4rem;background:var(--field);font-size:1rem}
.mrow select.ok{border-color:var(--ok);background:var(--okbg)}
.mrow select.no{border-color:var(--bad);background:var(--badbg)}

/* ordlista */
.abar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem}
.toggle{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.25rem}
.card h3{margin:0;font-size:1.3rem}
.card .gram{font-size:.75rem;color:var(--muted)}
.card .pos{display:inline-block;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:.3rem;padding:0 .35rem;margin-left:.3rem;vertical-align:.15em}
.card .exp{font-size:.92rem;margin-top:.2rem}
.card .ex{font-size:.88rem;font-style:italic;color:var(--muted)}
.card input{margin-top:.4rem;border:0;border-bottom:2px solid var(--line);background:transparent;padding:.2rem .1rem;font-size:.95rem}
.card input:focus{outline:none;border-color:var(--led)}
.card .reveal{display:none;border:1px dashed var(--line);background:transparent;border-radius:.4rem;padding:.4rem;font-size:.8rem;color:var(--muted);margin-top:.2rem}
.hideexp .card .exp,.hideexp .card .ex{display:none}
.hideexp .card .reveal{display:block}
.hideexp .card.open .exp,.hideexp .card.open .ex{display:block}
.hideexp .card.open .reveal{display:none}
.big{max-width:46rem;margin:0 auto;text-align:center;padding:2rem 1.5rem}
.big h3{font-size:3rem;margin:0}
.big .gram{font-size:1rem}
.big .exp{font-size:1.35rem;margin-top:1rem}
.big .ex{font-size:1.2rem;margin-top:.4rem}
.big input{text-align:center;font-size:1.1rem;max-width:22rem;align-self:center;width:100%}

footer{display:flex;align-items:center;justify-content:center;gap:.8rem;padding:.7rem 1rem 1rem;flex-wrap:wrap}
footer[hidden]{display:none}
.navbtn{border:2px solid var(--ink);background:var(--panel);border-radius:50%;width:2.4rem;height:2.4rem;font-size:1.15rem;font-weight:700;display:grid;place-items:center}
.navbtn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:center;max-width:44rem}
.dot{border:2px solid var(--line);background:var(--panel);border-radius:.3rem;min-width:1.75rem;height:1.75rem;font-size:.7rem;padding:0 .3rem}
.dot[aria-current="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dot.done{border-color:var(--ok)}
.dot.done[aria-current="true"]{border-color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:1rem}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:.8rem;padding:1.2rem 1.4rem;max-width:48rem;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 1rem 3rem rgba(0,0,0,.3)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.mbox h2{margin:0 0 .3rem;font-size:1.3rem}
.mbox h3{font-size:.95rem;margin:1.2rem 0 .4rem}
.mbox .lead{font-size:.82rem;color:var(--muted);margin:0}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.4rem}
.prog div{border:1px solid var(--line);border-radius:.4rem;padding:.35rem .6rem;font-size:.8rem;display:flex;justify-content:space-between;gap:.5rem}
.prog .bar{height:.35rem;background:var(--line);border-radius:.2rem;margin-top:.25rem;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.pill{border:1px solid var(--line);background:var(--board);border-radius:1rem;padding:.1rem .65rem;font-size:.8rem;display:inline-block;margin:.12rem .2rem .12rem 0}
.again{border:1px solid var(--line);border-radius:.45rem;padding:.45rem .7rem;margin:.35rem 0;font-size:.85rem}
.again .top{display:flex;justify-content:space-between;gap:.5rem;align-items:center;font-weight:700;margin-bottom:.15rem;font-size:.75rem;color:var(--muted)}
.again .mine{color:var(--bad)}
.again .right b{color:var(--ok)}
.go{border:1px solid var(--line);background:var(--panel);border-radius:.3rem;font-size:.72rem;padding:.05rem .45rem}
.gl{display:grid;grid-template-columns:auto 1fr;gap:.15rem 1rem;font-size:.85rem}
.gl b{font-weight:700}
.empty{color:var(--muted);font-size:.85rem}

@media (max-width:700px){
  main{padding:.9rem .9rem}
  header{padding:.5rem .8rem}
  .sent{font-size:1.25rem;line-height:2}
  .gap input{font-size:1.15rem}
  .num{font-size:1.7rem}
  .pairrow{grid-template-columns:1fr;font-size:1.25rem;gap:.3rem}
  .pairrow .mid{display:none}
  .mrow{grid-template-columns:1fr;gap:.2rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
  .big h3{font-size:2.2rem}
  .subnav button{padding:.35rem .6rem}
  header h1{font-size:.95rem;width:100%}
  .iconbtn .t{display:none}
  nav.tabs{flex:1 1 auto}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <h1>Ordträning 1–4</h1>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="tools">
    <button class="iconbtn sum" id="sumBtn">📝<span class="t"> Min</span> sammanfattning</button>
    <button class="iconbtn" id="clearBtn" title="Töm svaren i den här övningen">✕<span class="t"> Rensa övningen</span></button>
    <button class="iconbtn" id="themeBtn" title="Ljust/mörkt">◐</button>
    <button class="iconbtn" id="fsBtn" title="Helskärm (F)">⛶</button>
  </div>
</header>
<main id="main"></main>
<footer id="foot">
  <button class="navbtn" id="prev" aria-label="Föregående">‹</button>
  <div class="dots" id="dots"></div>
  <button class="navbtn" id="next" aria-label="Nästa">›</button>
</footer>

<div class="modal" id="sumModal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="sumTitle">

    <p class="lead">Det här ser bara du. Inget skickas någonstans. Visa gärna sammanfattningen för din lärare.</p>
    <div id="sumBody"></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const POS={subst:"substantiv",verb:"verb",adj:"adjektiv",adv:"adverb",prep:"preposition"};

/* ---------- ordformer ---------- */
const FORMS={}; // form -> {lemma,s,pos}
for(const s of [1,2,3,4]) for(const w of WORDS[s]){
  for(const f of w[5].split(" ")) if(!FORMS[f]) FORMS[f]={lemma:w[0],s,pos:w[2]};
  if(w[0].includes(" ")) for(const f of w[5].split(" ")) FORMS[f+" sig"]={lemma:w[0],s,pos:w[2]};
}
function norm(s){return String(s||"").toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim().replace(/^[.,!?;:"']+|[.,!?;:"']+$/g,"").trim();}
function lookup(v){v=norm(v); if(FORMS[v]) return FORMS[v]; const f=v.split(" ")[0]; return FORMS[f]||null;}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}

/* ---------- bygg övningarna ---------- */
// Varje uppgift: {key,label,type:'fill'|'mc'|'match', parts:[...], blanks:[{alts,pre}], orig, tag, pair, example}
function parseTemplate(t){ // ___ = lucka, [pre] = lucka med början
  const parts=[];const re=/___|\[([^\]]+)\]/g;let last=0,m;
  while((m=re.exec(t))){parts.push({t:t.slice(last,m.index)});parts.push({gap:true,pre:m[1]||""});last=re.lastIndex;}
  parts.push({t:t.slice(last)});return parts;
}
function mkFill(key,label,tmpl,ans,extra){
  const parts=parseTemplate(tmpl);const answers=ans.split(";");let bi=0;
  const blanks=[];parts.forEach(p=>{if(p.gap){blanks.push({alts:answers[bi].split("|"),pre:p.pre});p.bi=bi++;}});
  return Object.assign({key,label,type:"fill",parts,blanks},extra||{});
}
const EX={}; // exid -> {title,items,kind}
for(const s of [1,2,3,4]){
  EX["s"+s+"b"]={kind:"b",s,items:B[s].map((r,i)=>mkFill(`s${s}b-${i}`,i+1,r[1],r[2],{orig:r[0]}))};
  EX["s"+s+"c"]={kind:"c",s,items:C[s].map((r,i)=>{
    if(Array.isArray(r)) return mkFill(`s${s}c-${i}`,i+1,r[0],r[1]);
    if(r.match) return {key:`s${s}c-${i}`,label:"1–9",type:"match",m:r};
    const n=(s===4)?i+9:i+1; return {key:`s${s}c-${i}`,label:n,type:"mc",q:r};
  })};
}
for(const t of TEST){
  let items=[];
  if(t.items && t.id==="avsluta") items=t.items.map((r,i)=>mkFill(`t-${t.id}-${i}`,i+1,r[0],r[1],{test:true}));
  if(t.items && t.id==="part") items=t.items.map((r,i)=>mkFill(`t-${t.id}-${i}`,r[4]?"Ex":i,r[0],r[1],{test:true,tag:{base:r[2],pos:r[3]},example:!!r[4]}));
  if(t.pairs){let n=0;items=t.pairs.map((r,i)=>{
    const ex=!!r[3]; if(!ex) n++;
    const leftGap=r[0]==="___";
    return mkFill(`t-${t.id}-${i}`,ex?"Ex":n,leftGap?"___":r[1].replace("___","___"),r[2],{test:true,example:ex,pair:{left:r[0],right:r[1],leftGap,lh:t.id==="ning"?"Verb":"Verb",rh:"Substantiv"}});
  });}
  EX["t-"+t.id]={kind:"t",t,items};
}

/* ---------- tillstånd ---------- */
const KEY="ordtraning-1-4-v1";
let state={tab:"1",sub:{"1":"a","2":"a","3":"a","4":"a",t:"avsluta"},idx:{},log:{},tr:{},hideExp:false,aview:"grid"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function L(key){return state.log[key]||(state.log[key]={tries:0,wrong:[],done:false,shown:false,val:[]});}

const TABS=[["1","Ord 1"],["2","Ord 2"],["3","Ord 3"],["4","Ord 4"],["t","Test 1–4"]];
function curEx(){ if(state.tab==="t") return "t-"+state.sub.t; const sub=state.sub[state.tab]; return sub==="a"?null:"s"+state.tab+sub; }

/* ---------- rendering ---------- */
function render(){
  $("#tabs").innerHTML=TABS.map(([k,n])=>`<button role="tab" aria-selected="${state.tab===k}" data-tab="${k}">${n}</button>`).join("");
  const m=$("#main");
  if(state.tab==="t") return renderTest(m);
  const s=+state.tab, sub=state.sub[state.tab];
  const cLabel=s===4?"Para ihop och välj":"Fyll i";
  let h=`<div class="subnav" role="group" aria-label="Del">`+
    [["a","Ordlista"],["b","Omformulera"],["c",cLabel]].map(([k,n])=>`<button data-sub="${k}" aria-pressed="${sub===k}"><span class="k">${s}${k}</span>${n}</button>`).join("")+`</div>`;
  if(sub==="a"){ m.innerHTML=h+renderList(s); $("#foot").hidden=state.aview==="grid"; if(state.aview!=="grid") renderDots(); bindList(); return; }
  const exid="s"+s+sub, ex=EX[exid];
  const instr = sub==="b" ? "Skriv om meningen med ett ord från rutan. <b>Skriv ordet i rätt form.</b>"
    : s===4 ? "Para ihop början och slutet av meningarna. Välj sedan meningen som betyder samma sak."
    : "Välj ord från rutan och <b>skriv dem i rätt form.</b>";
  h+=`<p class="instr">${instr}</p>`;
  const it=ex.items[idx(exid)];
  if(it.type==="fill") h+=bankHtml(s,exid);
  h+=itemHtml(it);
  m.innerHTML=h; $("#foot").hidden=false; renderDots(); bindItem(it);
}
function renderTest(m){
  const t=EX["t-"+state.sub.t].t;
  let h=`<div class="subnav" role="group" aria-label="Del">`+TEST.map(x=>`<button data-sub="${x.id}" aria-pressed="${state.sub.t===x.id}">${x.short}</button>`).join("")+`</div>`;
  h+=`<p class="instr"><b>${esc(t.name)}.</b> ${esc(t.instr)}</p>`;
  const exid="t-"+t.id, it=EX[exid].items[idx(exid)];
  h+=itemHtml(it);
  m.innerHTML=h; $("#foot").hidden=false; renderDots(); bindItem(it);
}
function idx(exid){const n=EX[exid].items.length;let i=state.idx[exid]||0;if(i>=n)i=n-1;return i;}

function bankHtml(s,exid){
  const used=new Set();
  for(const it of EX[exid].items) if(it.type==="fill"&&L(it.key).done) for(const b of it.blanks){const f=lookup(b.alts[0]);if(f)used.add(f.lemma);}
  const open=state.bankClosed?"":" open";
  return `<details class="bank" id="bank"${open}><summary>Ordruta · klicka på ett ord för att skriva in det</summary><div class="chips">`+
    WORDS[s].map(w=>`<button class="chip${used.has(w[0])?" used":""}" data-w="${esc(w[0])}">${esc(w[0])}</button>`).join("")+`</div></details>`;
}

function itemHtml(it){
  const lg=L(it.key), done=lg.done||it.example;
  let h=`<section class="item${done?" done":""}" id="item"><div class="itemhead"><span class="num">${it.label}</span><div style="flex:1">`;
  if(it.type==="fill"){
    if(it.orig) h+=`<p class="orig">${esc(it.orig)}</p><div class="arrow">Skriv om</div>`;
    if(it.tag) h+=`<span class="tag"><b>${esc(it.tag.base)}</b> → ${esc(it.tag.pos)}</span>`;
    if(it.pair){
      const p=it.pair;
      const L1=p.leftGap?gapHtml(it,0,done):esc(p.left);
      const R1=p.leftGap?esc(p.right):esc(p.right.split("___")[0])+gapHtml(it,0,done);
      h+=`<div class="pairrow"><div><span class="lbl">Verb</span>${L1}</div><div class="mid">→</div><div><span class="lbl">Substantiv</span>${R1}</div></div>`;
    } else {
      h+=`<p class="sent">`+it.parts.map(p=>p.gap?gapHtml(it,p.bi,done):esc(p.t)).join("")+`</p>`;
    }
    h+=`</div></div><div class="actions">
      <button class="btn primary" id="checkBtn"${done?" hidden":""}>Kontrollera</button>
      <button class="btn quiet" id="hintBtn"${done?" hidden":""}>Ledtråd</button>
      <button class="btn quiet" id="showBtn"${done?" hidden":""}>Visa svar</button>
      <button class="btn primary" id="nextBtn"${done?"":" hidden"}>Nästa →</button></div>`;
  } else if(it.type==="mc"){
    h+=`<p class="sent" style="line-height:1.5">${esc(it.q.p)}</p><div class="arrow">Vilken mening betyder samma sak?</div><div class="opts">`+
      it.q.o.map((o,i)=>{let c="";if(lg.done&&i===it.q.r)c=" right";else if((lg.picked||[]).includes(i))c=" wrong";
        return `<button class="opt${c}" data-o="${i}"${lg.done?" disabled":""}><span class="l">${"abc"[i]})</span>${esc(o)}</button>`;}).join("")+`</div></div></div>
      <div class="actions"><button class="btn primary" id="nextBtn"${lg.done?"":" hidden"}>Nästa →</button></div>`;
  } else if(it.type==="match"){
    const vals=lg.val||[];
    h+=`<div class="match">`+it.m.left.map((l,i)=>{
      const v=vals[i]??"";const cls=lg.checked?(String(v)===String(it.m.key[i])?"ok":(v===""?"":"no")):"";
      return `<div class="mrow"><span>${i+1}. ${esc(l)} …</span><select data-m="${i}" class="${cls}"${lg.done?" disabled":""}><option value="">Välj slut …</option>`+
        it.m.right.map((r,j)=>`<option value="${j}"${String(v)===String(j)?" selected":""}>${"abcdefghi"[j]}) ${esc(r)}</option>`).join("")+`</select></div>`;}).join("")+
      `</div></div></div><div class="actions"><button class="btn primary" id="checkBtn"${lg.done?" hidden":""}>Kontrollera</button>
      <button class="btn quiet" id="showBtn"${lg.done?" hidden":""}>Visa svar</button>
      <button class="btn primary" id="nextBtn"${lg.done?"":" hidden"}>Nästa →</button></div>`;
  }
  h+=`<div class="feedback" id="fb"></div></section>`;
  return h;
}
function gapHtml(it,bi,done){
  const b=it.blanks[bi], lg=L(it.key);
  let v=lg.val[bi]??""; if(it.example) v=b.alts[0].slice(b.pre.length);
  const cls=done?"ok":(lg.bad&&lg.bad[bi]?"no":"");
  return `<span class="gap">${b.pre?`<span class="pre">${esc(b.pre)}</span>`:""}<input data-b="${bi}" class="${cls}" value="${esc(v)}" ${done?"disabled":""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lucka ${bi+1}"></span>`;
}

function renderDots(){
  let exid=curEx(), n, i, lab;
  if(!exid){ // ordlista, ett i taget
    const s=+state.tab; n=WORDS[s].length; i=state.idx["a"+s]||0;
    $("#dots").innerHTML=WORDS[s].map((w,j)=>`<button class="dot" data-d="${j}" aria-current="${j===i}">${j+1}</button>`).join("");
  } else {
    const items=EX[exid].items; n=items.length; i=idx(exid);
    $("#dots").innerHTML=items.map((it,j)=>`<button class="dot${(L(it.key).done||it.example)?" done":""}" data-d="${j}" aria-current="${j===i}">${it.label}</button>`).join("");
  }
  $("#prev").disabled=i<=0; $("#next").disabled=i>=n-1;
}
function go(d,abs){
  const exid=curEx();
  if(!exid){const s=+state.tab,k="a"+s,n=WORDS[s].length;let i=abs!=null?abs:(state.idx[k]||0)+d;state.idx[k]=Math.max(0,Math.min(n-1,i));}
  else {const n=EX[exid].items.length;let i=abs!=null?abs:idx(exid)+d;state.idx[exid]=Math.max(0,Math.min(n-1,i));}
  save();render();focusFirst();
}
function focusFirst(){ if(matchMedia("(pointer:fine)").matches){const inp=document.querySelector("#item input:not(:disabled)");if(inp)inp.focus();} }

/* ---------- ordlista ---------- */
function renderList(s){
  let h=`<p class="instr">Läs förklaringen och exemplet. <b>Skriv ordet på ditt eget språk</b> – det sparas bara på den här enheten.</p>
   <div class="abar"><div class="subnav" style="margin:0"><button data-av="grid" aria-pressed="${state.aview==="grid"}">Alla ord</button><button data-av="one" aria-pressed="${state.aview==="one"}">Ett i taget</button></div>
   <label class="toggle"><input type="checkbox" id="hideExp"${state.hideExp?" checked":""}> Dölj förklaringarna (testa dig själv)</label></div>`;
  const card=(w,big)=>`<div class="card${big?" big":""}" data-lemma="${esc(w[0])}"><h3>${esc(w[0])}</h3>
    <div class="gram">${esc(w[1])}<span class="pos">${POS[w[2]]}</span></div>
    <button class="reveal">Vad betyder ordet? Tryck för att se.</button>
    <div class="exp">${esc(w[3])}</div><div class="ex">${esc(w[4])}</div>
    <input data-tr="${esc(w[0])}" placeholder="Min översättning …" value="${esc(state.tr[w[0]]||"")}" autocomplete="off"></div>`;
  if(state.aview==="grid") h+=`<div class="cards${state.hideExp?" hideexp":""}" id="cards">`+WORDS[s].map(w=>card(w)).join("")+`</div>`;
  else { const i=state.idx["a"+s]||0; h+=`<div class="${state.hideExp?"hideexp":""}" id="cards">${card(WORDS[s][i],true)}</div>`; }
  return h;
}
function bindList(){
  document.querySelectorAll("[data-tr]").forEach(inp=>inp.addEventListener("input",()=>{const v=inp.value.trim();if(v)state.tr[inp.dataset.tr]=v;else delete state.tr[inp.dataset.tr];save();}));
  document.querySelectorAll(".reveal").forEach(b=>b.addEventListener("click",()=>b.closest(".card").classList.add("open")));
  $("#hideExp").addEventListener("change",e=>{state.hideExp=e.target.checked;save();render();});
}

/* ---------- kontroll ---------- */
function fb(kind,html){const f=$("#fb");f.className="feedback show "+kind;f.innerHTML=html;}
function candidates(b,v){const n=norm(v);const out=[n];if(b.pre){const p=norm(b.pre);if(!n.startsWith(p))out.push(p+n);else out.push(n);out.push(p+n);}return out;}
function blankRight(b,v){const alts=b.alts.map(norm);return candidates(b,v).some(c=>alts.includes(c));}
function diagnose(it,b,v){
  const n=norm(v); if(!n) return "empty";
  const alts=b.alts.map(norm);
  if(!it.test){const w=lookup(b.alts[0]),g=FORMS[n];if(w&&g&&g.lemma===w.lemma&&!n.includes(" ")&&!alts.some(a=>a.startsWith(n+" ")))return "form:"+w.pos;}
  for(const c of candidates(b,v)) for(const a of alts){
    if(a.startsWith(c+" ")) return "missing";
    if(a.length>3 && lev(c,a)<=(a.length>6?2:1)) return "typo";
  }
  if(!it.test){
    const want=lookup(b.alts[0]), got=lookup(n);
    if(want&&got&&got.lemma===want.lemma) return "form:"+want.pos;
    if(got&&got.s===want?.s) return "other";
  }
  return "wrong";
}
const MSG={
  empty:"Skriv något i luckan först.",
  missing:"Du är på rätt väg, men det saknas ett ord.",
  typo:"Nästan! Kontrollera stavningen.",
  "form:verb":"Rätt ord, men fel form. Vilket tempus behövs – presens, preteritum, supinum eller infinitiv?",
  "form:subst":"Rätt ord, men fel form. Behövs obestämd eller bestämd form? Singular eller plural?",
  "form:adj":"Rätt ord, men fel form. Tänk på om det gäller ett en-ord, ett ett-ord eller plural.",
  "form:adv":"Rätt ord, men fel form.",
  other:"Det ordet finns i rutan, men det passar inte här. Läs meningen en gång till.",
  wrong:"Inte riktigt. Prova igen – eller tryck på Ledtråd."
};
function check(it){
  const lg=L(it.key); const inputs=[...document.querySelectorAll("#item input[data-b]")];
  lg.val=inputs.map(i=>i.value); lg.bad=[];
  let allOk=true, msgs=[];
  inputs.forEach((inp,i)=>{
    const b=it.blanks[i];
    if(blankRight(b,inp.value)){inp.classList.add("ok");inp.classList.remove("no");lg.bad[i]=false;}
    else{allOk=false;lg.bad[i]=true;inp.classList.add("no");const d=diagnose(it,b,inp.value);msgs.push(d);}
  });
  if(msgs.includes("empty")&&msgs.every(m=>m==="empty")){fb("info",MSG.empty);save();return;}
  lg.tries++;
  if(allOk){
    lg.done=true; save();
    fb("ok",lg.tries===1?"Rätt!":"Rätt! Bra att du inte gav upp.");
    finishUI();
  } else {
    const wrongVals=inputs.filter((_,i)=>lg.bad[i]).map(i=>i.value.trim()).filter(Boolean);
    if(wrongVals.length) lg.wrong.push(wrongVals.join(" / "));
    const d=msgs.find(m=>m!=="empty")||"wrong";
    let msg=MSG[d]; if(inputs.length>1 && inputs.some((_,i)=>!lg.bad[i])) msg="En av luckorna är rätt. "+msg;
    fb("warn",msg); save();
  }
}
function finishUI(){
  document.querySelectorAll("#item input").forEach(i=>{i.disabled=true;i.classList.add("ok");i.classList.remove("no");});
  ["checkBtn","hintBtn","showBtn"].forEach(id=>{const b=document.getElementById(id);if(b)b.hidden=true;});
  $("#nextBtn").hidden=false; $("#item").classList.add("done"); $("#nextBtn").focus({preventScroll:true});
  renderDots(); const bank=$("#bank"); if(bank){const s=+state.tab;const tmp=document.createElement("div");tmp.innerHTML=bankHtml(s,curEx());bank.querySelector(".chips").innerHTML=tmp.querySelector(".chips").innerHTML;bindChips();}
}
function hint(it){
  const lg=L(it.key); lg.hints=(lg.hints||0)+1; save();
  const bi=Math.max(0,(lg.bad||[]).findIndex(x=>x)); const b=it.blanks[bi]; const ans=b.alts[0];
  const who=it.blanks.length>1?` (lucka ${bi+1})`:"";
  if(it.test){
    const rest=ans.slice(b.pre.length);
    if(lg.hints===1) fb("info",`Ordet${who} har ${ans.replace(/ /g,"").length} bokstäver.`);
    else fb("info",`Ordet${who} börjar så här: <b>${esc(ans.slice(0,b.pre.length+Math.min(3,Math.ceil(rest.length/2))))}…</b>`);
    return;
  }
  const f=lookup(ans);
  if(lg.hints===1) fb("info",`Det är ett ${POS[f.pos]}${who} som börjar på <b>${esc(ans[0].toUpperCase())}</b>.`);
  else fb("info",`Grundformen är <b>${esc(f.lemma)}</b>${who}. Vilken form passar i meningen?`);
}
function showAns(it){
  const lg=L(it.key); lg.shown=true; lg.done=true;
  if(it.type==="fill"){ lg.val=it.blanks.map(b=>b.alts[0].slice(b.pre.length)); document.querySelectorAll("#item input[data-b]").forEach((inp,i)=>inp.value=lg.val[i]); fb("info","Här är svaret. Läs meningen högt och gå sedan vidare."); }
  if(it.type==="match"){ lg.val=it.m.key.slice(); lg.checked=true; save(); render(); fb("info","Här är svaren."); return; }
  save(); finishUI();
}

/* ---------- händelser ---------- */
let activeInput=null;
function bindChips(){
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    const inp=(activeInput&&document.body.contains(activeInput)&&!activeInput.disabled)?activeInput:document.querySelector("#item input:not(:disabled)");
    if(!inp)return; inp.value=c.dataset.w; inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
  }));
}
function bindItem(it){
  bindChips();
  const bank=$("#bank"); if(bank) bank.addEventListener("toggle",()=>{state.bankClosed=!bank.open;save();});
  document.querySelectorAll("#item input[data-b]").forEach(inp=>{
    inp.addEventListener("focus",()=>activeInput=inp);
    inp.addEventListener("input",()=>{inp.classList.remove("no");const lg=L(it.key);lg.val[+inp.dataset.b]=inp.value;save();});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check(it);}});
  });
  const on=(id,f)=>{const b=document.getElementById(id);if(b)b.addEventListener("click",f);};
  on("checkBtn",()=>it.type==="match"?checkMatch(it):check(it));
  on("hintBtn",()=>hint(it)); on("showBtn",()=>showAns(it)); on("nextBtn",()=>go(1));
  if(it.type==="mc") document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const lg=L(it.key),o=+b.dataset.o; lg.tries++;
    if(o===it.q.r){lg.done=true;b.classList.add("right");document.querySelectorAll(".opt").forEach(x=>x.disabled=true);fb("ok","Rätt!");$("#nextBtn").hidden=false;$("#item").classList.add("done");renderDots();}
    else{lg.picked=(lg.picked||[]).concat(o);lg.wrong.push(it.q.o[o]);b.classList.add("wrong");fb("warn","Nej, det betyder något annat. Prova ett annat alternativ.");}
    save();
  }));
  if(it.type==="match") document.querySelectorAll("select[data-m]").forEach(sel=>sel.addEventListener("change",()=>{const lg=L(it.key);lg.val[+sel.dataset.m]=sel.value;sel.classList.remove("ok","no");save();}));
}
function checkMatch(it){
  const lg=L(it.key); lg.tries++; lg.checked=true; let ok=0,empty=0;
  document.querySelectorAll("select[data-m]").forEach(sel=>{const i=+sel.dataset.m;
    if(sel.value===""){empty++;sel.classList.remove("ok","no");return;}
    if(+sel.value===it.m.key[i]){ok++;sel.classList.add("ok");sel.classList.remove("no");}
    else{sel.classList.add("no");sel.classList.remove("ok");lg.wrong.push(`${it.m.left[i]} ${it.m.right[+sel.value]}`);}
  });
  if(ok===it.m.left.length){lg.done=true;save();fb("ok","Alla är rätt!");document.querySelectorAll("select[data-m]").forEach(s=>s.disabled=true);
    $("#checkBtn").hidden=true;$("#showBtn").hidden=true;$("#nextBtn").hidden=false;$("#item").classList.add("done");renderDots();}
  else {save();fb("warn",`${ok} av ${it.m.left.length} stämmer. Ändra de röda${empty?" och fyll i de tomma":""}.`);}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-sub],[data-d],[data-av]"); if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;save();render();focusFirst();}
  else if(t.dataset.sub){ if(state.tab==="t")state.sub.t=t.dataset.sub; else state.sub[state.tab]=t.dataset.sub; save();render();focusFirst(); }
  else if(t.dataset.av){state.aview=t.dataset.av;save();render();}
  else if(t.dataset.d!=null) go(0,+t.dataset.d);
});
$("#prev").addEventListener("click",()=>go(-1));
$("#next").addEventListener("click",()=>go(1));
document.addEventListener("keydown",e=>{
  if(!$("#sumModal").hidden){if(e.key==="Escape")closeSum();return;}
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="select"||tag==="textarea") return;
  if(e.key==="ArrowRight"){go(1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){go(-1);e.preventDefault();}
  else if(e.key==="f"||e.key==="F"){toggleFs();}
  else if(e.key===" " && state.sub[state.tab]==="a" && state.tab!=="t"){const c=document.querySelector(".card");if(c){c.classList.add("open");e.preventDefault();}}
});
function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();}
$("#fsBtn").addEventListener("click",toggleFs);
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,cur=r.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark"); try{localStorage.setItem(KEY+"-theme",dark?"light":"dark");}catch(e){}
});
try{const th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
$("#clearBtn").addEventListener("click",()=>{
  const exid=curEx();
  if(!exid){ if(confirm("Töm dina översättningar i den här ordlistan?")){for(const w of WORDS[+state.tab])delete state.tr[w[0]];save();render();} return; }
  if(!confirm("Töm alla svar i den här övningen?"))return;
  for(const it of EX[exid].items) delete state.log[it.key]; state.idx[exid]=0; save(); render();
});

/* ---------- sammanfattning ---------- */
function sentenceWith(it,vals){
  if(it.type!=="fill") return "";
  if(it.pair){const p=it.pair;return p.leftGap?`<b>${esc(vals[0])}</b> → ${esc(p.right)}`:`${esc(p.left)} → ${esc(p.right.replace("___",""))}<b>${esc(vals[0])}</b>`;}
  return it.parts.map(p=>p.gap?`<b>${esc(p.pre+ (vals[p.bi]||"").slice(0))}</b>`:esc(p.t)).join("");
}
function exName(exid){ if(exid.startsWith("t-")) return "Test · "+EX[exid].t.short; const s=exid[1],k=exid[2]; return `Ord ${s} · ${s}${k}`; }
function openSum(){
  let h=`<h3>Så långt har du kommit</h3><div class="prog">`;
  for(const exid of Object.keys(EX)){
    const items=EX[exid].items.filter(i=>!i.example); const d=items.filter(i=>L(i.key).done).length;
    h+=`<div style="display:block"><div style="display:flex;justify-content:space-between"><span>${exName(exid)}</span><span>${d}/${items.length}</span></div><div class="bar"><i style="width:${Math.round(100*d/items.length)}%"></i></div></div>`;
  }
  h+=`</div>`;
  // ord att öva på
  const hard=new Map();
  for(const exid of Object.keys(EX)) for(const it of EX[exid].items){const lg=state.log[it.key];if(!lg)continue;
    if((lg.wrong.length||lg.shown) && it.type==="fill") for(const b of it.blanks){const f=lookup(b.alts[0]);hard.set(f?f.lemma:b.alts[0],true);} }
  h+=`<h3>Ord som du behöver öva mer på</h3>`+(hard.size?[...hard.keys()].map(w=>`<span class="pill">${esc(w)}</span>`).join(""):`<p class="empty">Inga ännu.</p>`);
  // fel
  h+=`<h3>Mina svar som inte blev rätt direkt</h3>`; let any=false;
  for(const exid of Object.keys(EX)) EX[exid].items.forEach((it,j)=>{const lg=state.log[it.key];if(!lg||(!lg.wrong.length&&!lg.shown))return;any=true;
    const right=it.type==="fill"?sentenceWith(it,it.blanks.map(b=>b.alts[0].slice(b.pre.length))):it.type==="mc"?esc(it.q.p)+" = <b>"+esc(it.q.o[it.q.r])+"</b>":"Para ihop 1–9";
    h+=`<div class="again"><div class="top"><span>${exName(exid)} · uppgift ${it.label}</span><button class="go" data-goto="${exid}|${j}">Gå till uppgiften</button></div>
      ${lg.wrong.length?`<div class="mine">Du skrev: ${lg.wrong.slice(-3).map(esc).join(" · ")}</div>`:""}${lg.shown?`<div class="mine">Du tittade på svaret.</div>`:""}
      <div class="right">Rätt: ${right}</div></div>`;});
  if(!any) h+=`<p class="empty">Inga ännu.</p>`;
  // ordlista
  const trs=Object.entries(state.tr);
  h+=`<h3>Min ordlista</h3>`+(trs.length?`<div class="gl">`+trs.map(([w,t])=>`<b>${esc(w)}</b><span>${esc(t)}</span>`).join("")+`</div>`:`<p class="empty">Du har inte skrivit några översättningar ännu.</p>`);
  h+=`<div class="actions"><button class="btn quiet" id="resetAll">Nollställ allt jag har gjort</button></div>`;
  $("#sumBody").innerHTML=h; $("#sumModal").hidden=false;
  $("#resetAll").addEventListener("click",()=>{if(confirm("Radera alla dina svar och översättningar på den här enheten?")){state.log={};state.tr={};state.idx={};save();closeSum();render();}});
  document.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>{
    const [exid,j]=b.dataset.goto.split("|");
    if(exid.startsWith("t-")){state.tab="t";state.sub.t=exid.slice(2);}else{state.tab=exid[1];state.sub[exid[1]]=exid[2];}
    state.idx[exid]=+j; save(); closeSum(); render(); focusFirst();
  }));
}
function closeSum(){$("#sumModal").hidden=true;}
$("#sumBtn").addEventListener("click",openSum);
$("#sumClose").addEventListener("click",closeSum);
$("#sumModal").addEventListener("click",e=>{if(e.target.id==="sumModal")closeSum();});

render();
</script>
</body>
